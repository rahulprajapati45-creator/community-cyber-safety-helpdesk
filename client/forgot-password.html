<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CyberSafe Helpdesk</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050b14;
            color: white;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(10, 20, 35, 0.95);
            border: 1px solid rgba(103, 232, 249, 0.35);
            box-shadow:
                0 0 20px rgba(103, 232, 249, 0.15),
                0 0 45px rgba(103, 232, 249, 0.08);
        }

        h2 {
            text-align: center;
            color: #67e8f9;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #a7b4c5;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #dbeafe;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b1626;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #67e8f9;
            box-shadow: 0 0 10px rgba(103, 232, 249, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0891b2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
        }

        button:hover {
            background: #06b6d4;
            box-shadow: 0 0 15px rgba(103, 232, 249, 0.3);
        }

        #otpSection,
        #passwordSection {
            display: none;
            margin-top: 20px;
        }

        .message {
            text-align: center;
            min-height: 22px;
            font-size: 14px;
            margin-top: 8px;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #67e8f9;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        #resendOtpBtn {
            background: transparent;
            border: 1px solid #67e8f9;
            color: #67e8f9;
        }

        #resendOtpBtn:hover {
            background: rgba(103, 232, 249, 0.08);
        }
    </style>
</head>

<body>

<div class="forgot-container">

    <h2>🔐 Forgot Password</h2>

    <p class="subtitle">
        Enter your registered email address to reset your password.
    </p>

    <!-- EMAIL SECTION -->

    <div id="emailSection">

        <label for="email">
            Registered Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >

        <button
            type="button"
            id="sendOtpBtn">
            📧 Send OTP
        </button>

    </div>


    <!-- OTP SECTION -->

    <div id="otpSection">

        <label for="otp">
            Enter OTP
        </label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
        >

        <button
            type="button"
            id="verifyOtpBtn">
            ✓ Verify OTP
        </button>

        <button
            type="button"
            id="resendOtpBtn">
            🔄 Resend OTP
        </button>

    </div>


    <!-- NEW PASSWORD SECTION -->

    <div id="passwordSection">

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <button
            type="button"
            id="resetPasswordBtn">
            🔑 Reset Password
        </button>

    </div>


    <p
        id="message"
        class="message">
    </p>


    <a
        href="login.html"
        class="back-login">
        ← Back to Login
    </a>

</div>


<script>

    // ==========================================
    // ELEMENTS
    // ==========================================

    const emailInput =
        document.getElementById("email");

    const sendOtpBtn =
        document.getElementById("sendOtpBtn");

    const otpSection =
        document.getElementById("otpSection");

    const otpInput =
        document.getElementById("otp");

    const verifyOtpBtn =
        document.getElementById("verifyOtpBtn");

    const resendOtpBtn =
        document.getElementById("resendOtpBtn");

    const passwordSection =
        document.getElementById("passwordSection");

    const resetPasswordBtn =
        document.getElementById("resetPasswordBtn");

    const newPasswordInput =
        document.getElementById("newPassword");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const message =
        document.getElementById("message");


    // ==========================================
    // SEND OTP
    // ==========================================

    async function sendForgotPasswordOTP() {

        const email =
            emailInput.value.trim().toLowerCase();

        if (!email) {

            message.style.color = "#f87171";

            message.textContent =
                "Please enter your registered email.";

            return;
        }

        if (!email.includes("@")) {

            message.style.color = "#f87171";

            message.textContent =
                "Please enter a valid email address.";

            return;
        }

        message.style.color = "#67e8f9";

        message.textContent =
            "Sending OTP...";

        sendOtpBtn.disabled = true;

        try {

            const response =
                await fetch(
                    "/api/user-otp/forgot-password/send-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.success) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    data.message ||
                    "Unable to send OTP.";

                sendOtpBtn.disabled = false;

                return;
            }

            sessionStorage.setItem(
                "forgotPasswordEmail",
                email
            );

            otpSection.style.display =
                "block";

            message.style.color =
                "#34d399";

            message.textContent =
                "OTP sent to your registered email. OTP is valid for 1 minute.";

            otpInput.focus();

            startResendTimer();

        } catch (error) {

            console.error(
                "Forgot password OTP error:",
                error
            );

            message.style.color =
                "#f87171";

            message.textContent =
                "Unable to send OTP. Please try again.";

            sendOtpBtn.disabled = false;
        }
    }


    sendOtpBtn.addEventListener(
        "click",
        sendForgotPasswordOTP
    );


    // ==========================================
    // VERIFY OTP
    // ==========================================

    verifyOtpBtn.addEventListener(
        "click",
        async function () {

            const email =
                sessionStorage.getItem(
                    "forgotPasswordEmail"
                );

            const otp =
                otpInput.value.trim();

            if (!email) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Session expired. Please start again.";

                return;
            }

            if (!/^\d{6}$/.test(otp)) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Please enter a valid 6-digit OTP.";

                return;
            }

            message.style.color =
                "#67e8f9";

            message.textContent =
                "Verifying OTP...";

            try {

                const response =
                    await fetch(
                        "/api/user-otp/forgot-password/verify-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                otp: otp
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok ||
    !data.success) {

    message.style.color =
        "#f87171";

    message.textContent =
        data.message ||
        "Invalid or expired OTP.";

    wrongOtpAttempts++;

    if (wrongOtpAttempts >= 5) {

        message.textContent =
            "Too many incorrect attempts. Returning to Login...";

        verifyOtpBtn.disabled = true;
        resendOtpBtn.disabled = true;

        sessionStorage.removeItem(
            "forgotPasswordEmail"
        );

        setTimeout(
            function () {

                window.location.replace(
                    "login.html"
                );

            },
            1000
        );

        return;
    }

    return;
}

                message.style.color =
                    "#34d399";

                message.textContent =
                    "OTP verified successfully.";

                passwordSection.style.display =
                    "block";

                verifyOtpBtn.style.display =
                    "none";

                resendOtpBtn.style.display =
                    "none";

                otpInput.disabled = true;

                newPasswordInput.focus();

            } catch (error) {

                console.error(
                    "OTP verification error:",
                    error
                );

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Unable to verify OTP. Please try again.";
            }
        }
    );


    // ==========================================
    // RESEND OTP
    // ==========================================

    let resendTimer = null;
    let wrongOtpAttempts = 0;

    function startResendTimer() {

        let seconds = 30;

        resendOtpBtn.disabled = true;

        resendOtpBtn.textContent =
            "🔄 Resend OTP (" + seconds + "s)";

        clearInterval(resendTimer);

        resendTimer = setInterval(
            function () {

                seconds--;

                if (seconds <= 0) {

                    clearInterval(resendTimer);

                    resendOtpBtn.disabled =
                        false;

                    resendOtpBtn.textContent =
                        "🔄 Resend OTP";

                    return;
                }

                resendOtpBtn.textContent =
                    "🔄 Resend OTP (" +
                    seconds +
                    "s)";

            },
            1000
        );
    }


    resendOtpBtn.addEventListener(
        "click",
        async function () {

            const email =
                sessionStorage.getItem(
                    "forgotPasswordEmail"
                );

            if (!email) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Please enter your email again.";

                return;
            }

            message.style.color =
                "#67e8f9";

            message.textContent =
                "Sending new OTP...";

            resendOtpBtn.disabled = true;

            try {

                const response =
                    await fetch(
                        "/api/user-otp/forgot-password/send-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );

                const data =
                    await response.json();

                if (!response.ok ||
                    !data.success) {

                    message.style.color =
                        "#f87171";

                    message.textContent =
                        data.message ||
                        "Unable to resend OTP.";

                    resendOtpBtn.disabled =
                        false;

                    return;
                }

                message.style.color =
                    "#34d399";

                message.textContent =
                    "New OTP sent successfully.";

                otpInput.value = "";
                wrongOtpAttempts = 0;

                startResendTimer();

            } catch (error) {

                console.error(
                    "Resend OTP error:",
                    error
                );

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Unable to resend OTP.";

                resendOtpBtn.disabled =
                    false;
            }
        }
    );


    // ==========================================
    // RESET PASSWORD
    // ==========================================

    resetPasswordBtn.addEventListener(
        "click",
        async function () {

            const email =
                sessionStorage.getItem(
                    "forgotPasswordEmail"
                );

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (!email) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Session expired. Please start again.";

                return;
            }


            if (newPassword.length < 6) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            if (newPassword !== confirmPassword) {

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            message.style.color =
                "#67e8f9";

            message.textContent =
                "Resetting password...";

            resetPasswordBtn.disabled = true;


            try {

                const response =
                    await fetch(
                        "/api/user-otp/forgot-password/reset",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                newPassword: newPassword
                            })
                        }
                    );

                const data =
                    await response.json();


                if (!response.ok ||
                    !data.success) {

                    message.style.color =
                        "#f87171";

                    message.textContent =
                        data.message ||
                        "Password reset failed.";

                    resetPasswordBtn.disabled =
                        false;

                    return;
                }


                sessionStorage.removeItem(
                    "forgotPasswordEmail"
                );


                message.style.color =
                    "#34d399";

                message.textContent =
                    "Password reset successfully! Redirecting to Login...";


                setTimeout(
                    function () {

                        window.location.replace(
                            "login.html"
                        );

                    },
                    1500
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );

                message.style.color =
                    "#f87171";

                message.textContent =
                    "Unable to reset password. Please try again.";

                resetPasswordBtn.disabled =
                    false;
            }
        }
    );

</script>

</body>
</html>
