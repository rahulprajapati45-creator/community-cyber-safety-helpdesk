<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Email Verification | CyberSafe Helpdesk</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(139, 92, 246, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(6, 182, 212, 0.14),
                    transparent 35%
                ),
                #020617;

            color: #e2e8f0;
        }


        .card {
            width: 100%;
            max-width: 430px;

            padding: 35px 30px;

            border-radius: 22px;

            background:
                rgba(15, 23, 42, 0.88);

            border:
                1px solid
                rgba(103, 232, 249, 0.18);

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, 0.45),

                0 0 35px
                rgba(139, 92, 246, 0.10);

            backdrop-filter:
                blur(15px);

            text-align: center;
        }


        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 34px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.20),
                    rgba(6, 182, 212, 0.18)
                );

            border:
                1px solid
                rgba(103, 232, 249, 0.25);

            box-shadow:
                0 0 30px
                rgba(6, 182, 212, 0.15);

            animation:
                pulse 2s infinite;
        }


        h1 {
            margin:
                0 0 10px;

            font-size: 27px;
        }


        .subtitle {
            margin:
                0 auto 25px;

            max-width: 340px;

            color: #94a3b8;

            line-height: 1.6;

            font-size: 14px;
        }


        .email-box {
            margin-bottom: 22px;

            padding: 12px 15px;

            border-radius: 12px;

            background:
                rgba(6, 182, 212, 0.06);

            border:
                1px solid
                rgba(103, 232, 249, 0.16);

            color: #67e8f9;

            font-size: 14px;

            word-break: break-word;
        }


        .otp-input {
            width: 100%;

            padding: 15px;

            border-radius: 13px;

            border:
                1px solid
                rgba(148, 163, 184, 0.25);

            background:
                rgba(2, 6, 23, 0.75);

            color: white;

            text-align: center;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 8px;

            outline: none;
        }


        .otp-input:focus {
            border-color:
                #67e8f9;

            box-shadow:
                0 0 20px
                rgba(103, 232, 249, 0.12);
        }


        button {
            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #06b6d4
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(6, 182, 212, 0.20);
        }


        button:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        .timer {
            margin-top: 18px;

            color: #fbbf24;

            font-size: 13px;
        }


        .resend {
            margin-top: 12px;

            background:
                transparent;

            border:
                1px solid
                rgba(103, 232, 249, 0.25);

            color: #67e8f9;
        }


        .message {
            min-height: 22px;

            margin-top: 18px;

            font-size: 14px;

            line-height: 1.5;
        }


        .back-login {
            display: inline-block;

            margin-top: 20px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }


        .back-login:hover {
            color: #67e8f9;
        }


        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }


        @media (max-width: 480px) {

            .card {
                padding:
                    30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .otp-input {
                font-size: 22px;

                letter-spacing: 6px;
            }
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="icon">
            ✉️
        </div>


        <h1>
            Verify Your Email
        </h1>


        <p class="subtitle">

            We have sent a 6-digit verification
            code to your email address.

        </p>


        <div
            class="email-box"
            id="emailDisplay"
        >
            Loading email...
        </div>


        <input
            type="text"
            id="otpInput"
            class="otp-input"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="••••••"
        >


        <button
            id="verifyBtn"
            type="button"
        >
            Verify Email
        </button>


        <div
            class="timer"
            id="timer"
        >
            OTP expires in 01:00
        </div>


        <button
            id="resendBtn"
            class="resend"
            type="button"
            disabled
        >
            Resend OTP
        </button>


        <div
            class="message"
            id="message"
        ></div>


        <a
            href="signup.html"
            class="back-login"
        >
            ← Back to Registration
        </a>

    </div>


    <script>

        const email =
            sessionStorage.getItem(
                "registrationOtpEmail"
            );


        const emailDisplay =
            document.getElementById(
                "emailDisplay"
            );

        const otpInput =
            document.getElementById(
                "otpInput"
            );

        const verifyBtn =
            document.getElementById(
                "verifyBtn"
            );

        const resendBtn =
            document.getElementById(
                "resendBtn"
            );

        const timer =
            document.getElementById(
                "timer"
            );

        const message =
            document.getElementById(
                "message"
            );


        let otpSeconds = 60;

        let resendSeconds = 30;

        let resendTimer = null;

        let wrongOtpAttempts = 0;


        // =====================================================
        // Check registration email
        // =====================================================

        if (!email) {

            window.location.replace(
                "signup.html"
            );

        }
        else {

            emailDisplay.textContent =
                email;

        }


        // =====================================================
        // OTP TIMER
        // =====================================================

        function startOtpTimer() {

            clearInterval(
                window.otpTimer
            );

            otpSeconds = 60;

            verifyBtn.disabled =
                false;


            window.otpTimer =
                setInterval(
                    function () {

                        otpSeconds--;

                        const minutes =
                            Math.floor(
                                otpSeconds / 60
                            );

                        const seconds =
                            otpSeconds % 60;


                        timer.textContent =
                            "OTP expires in " +
                            String(minutes)
                                .padStart(2, "0") +
                            ":" +
                            String(seconds)
                                .padStart(2, "0");


                        if (
                            otpSeconds <= 0
                        ) {

                            clearInterval(
                                window.otpTimer
                            );

                            timer.textContent =
                                "OTP expired.";

                            verifyBtn.disabled =
                                true;
                        }

                    },
                    1000
                );
        }


        // =====================================================
        // RESEND TIMER
        // =====================================================

        function startResendTimer() {

            clearInterval(
                resendTimer
            );

            resendSeconds = 30;

            resendBtn.disabled =
                true;


            resendBtn.textContent =
                "Resend OTP (30s)";


            resendTimer =
                setInterval(
                    function () {

                        resendSeconds--;


                        if (
                            resendSeconds <= 0
                        ) {

                            clearInterval(
                                resendTimer
                            );

                            resendBtn.disabled =
                                false;

                            resendBtn.textContent =
                                "Resend OTP";

                            return;
                        }


                        resendBtn.textContent =
                            `Resend OTP (${resendSeconds}s)`;

                    },
                    1000
                );
        }


        // =====================================================
        // VERIFY OTP
        // =====================================================

        verifyBtn.addEventListener(
            "click",
            async function () {

                const otp =
                    otpInput.value.trim();


                if (
                    !/^\d{6}$/.test(otp)
                ) {

                    message.style.color =
                        "#f87171";

                    message.textContent =
                        "Please enter a valid 6-digit OTP.";

                    return;
                }


                verifyBtn.disabled =
                    true;


                message.style.color =
                    "#67e8f9";

                message.textContent =
                    "Verifying OTP...";


                try {

                    const response =
                        await fetch(
                            "/api/registration-otp/verify-otp",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email,
                                        otp: otp
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.style.color =
                            "#f87171";

                        message.textContent =
                            data.message ||
                            "Invalid or expired OTP.";


                        wrongOtpAttempts++;


                        if (
                            wrongOtpAttempts >= 5
                        ) {

                            message.textContent =
                                "Too many incorrect attempts. Returning to Registration...";

                            verifyBtn.disabled =
                                true;

                            resendBtn.disabled =
                                true;

                            sessionStorage.removeItem(
                                "registrationOtpEmail"
                            );


                            setTimeout(
                                function () {

                                    window.location.replace(
                                        "signup.html"
                                    );

                                },
                                1000
                            );

                            return;
                        }


                        verifyBtn.disabled =
                            otpSeconds <= 0;

                        return;
                    }


                    // =================================================
                    // Registration successful
                    // =================================================

                    message.style.color =
                        "#34d399";

                    message.textContent =
                        "Email verified successfully! Registration completed.";


                    clearInterval(
                        window.otpTimer
                    );

                    clearInterval(
                        resendTimer
                    );


                    verifyBtn.disabled =
                        true;

                    resendBtn.disabled =
                        true;


                    sessionStorage.removeItem(
                        "registrationOtpEmail"
                    );


                    setTimeout(
                        function () {

                            window.location.replace(
                                "login.html"
                            );

                        },
                        1200
                    );

                }
                catch (error) {

                    console.error(
                        "Registration OTP verification error:",
                        error
                    );


                    message.style.color =
                        "#f87171";

                    message.textContent =
                        "Server connection error. Please try again.";


                    verifyBtn.disabled =
                        otpSeconds <= 0;

                }

            }
        );


        // =====================================================
        // RESEND OTP
        // =====================================================

        resendBtn.addEventListener(
            "click",
            async function () {

                resendBtn.disabled =
                    true;


                message.style.color =
                    "#67e8f9";

                message.textContent =
                    "Sending new OTP...";


                try {

                    const response =
                        await fetch(
                            "/api/registration-otp/resend-otp",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email
                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.style.color =
                            "#f87171";

                        message.textContent =
                            data.message ||
                            "Unable to resend OTP.";

                        resendBtn.disabled =
                            false;

                        return;
                    }


                    otpInput.value = "";

                    wrongOtpAttempts = 0;


                    message.style.color =
                        "#34d399";

                    message.textContent =
                        "New OTP sent successfully.";


                    startOtpTimer();

                    startResendTimer();


                }
                catch (error) {

                    console.error(
                        "Registration OTP resend error:",
                        error
                    );


                    message.style.color =
                        "#f87171";

                    message.textContent =
                        "Server connection error. Please try again.";

                    resendBtn.disabled =
                        false;

                }

            }
        );


        // Start timers

        startOtpTimer();

        startResendTimer();


        // Allow only numbers

        otpInput.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 6);

            }
        );

    </script>

</body>

</html>
